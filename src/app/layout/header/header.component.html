<header class="app-header">

      <img src="assets/logos/Logo SistersMade.png" alt="SistersMade" class="logo" />
      <h1 class="site-title sr-only">SistersMade</h1>
    </a>
    <nav>
      <ul class="nav-links">
        <li>
          <a routerLink="/" routerLinkActive="router-link-active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
        </li>
        <li>
          <a routerLink="/community" routerLinkActive="router-link-active">Communauté</a>
        </li>
        <li>
          <a routerLink="/profile" routerLinkActive="router-link-active">Mon profil</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
